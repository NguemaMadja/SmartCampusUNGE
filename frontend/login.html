<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - SmartCampusUNGE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: rgba(0, 64, 128, 0.85) url("image/IMGE-UNGE2.jpg") no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .login-card {
      max-width: 420px;
      margin: 80px auto;
      background: rgba(255,255,255,0.95);
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.35);
    }
    .login-card h4 {
      font-weight: bold;
      color: #004080;
    }
    footer {
      background-color: #004080;
      color: white;
      padding: 15px;
      text-align: center;
      margin-top: auto;
    }
    .social-buttons .btn {
      margin: 5px;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-login {
      background-color: #004080;
      color: white;
      border: none;
    }
    .btn-login:hover {
      background-color: #003366;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Cabecera con logo en esquina -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="logo/LOGO-UNGE-1.png" alt="Logo UNGE" class="img-fluid me-2" style="max-height:60px;">
        <span>SmartCampusUNGE</span>
      </a>
      <div class="ms-auto">
        <a href="login.html" class="btn btn-login me-2">Login</a>
        <a href="radio.html" class="btn btn-success">
          <i class="bi bi-broadcast"></i> Radio UNGE
        </a>
      </div>
    </nav>
  </header>

  <!-- Tarjeta de login -->
  <div class="login-card">
    <h4 class="text-center mb-4">Acceso al Campus</h4>
    <form id="formLogin">
      <div class="mb-3">
        <label for="correo" class="form-label">Correo</label>
        <input type="email" class="form-control" id="correo" placeholder="usuario@ejemplo.com" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" placeholder="********" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 mb-2">Ingresar</button>
      <a href="index.html" class="btn btn-secondary w-100">Regresar al Inicio</a>
    </form>
  </div>

  <!-- Pie de página -->
   <footer>
    <p>TODOS LOS DERECHOS RESERVADOS © IoT A NUESTRO ALCANCE - UNGE 2026</p>
    <div class="social-buttons">
      <a href="#" class="btn btn-outline-light"><i class="bi bi-twitter"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-facebook"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-instagram"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-youtube"></i></a>
    </div>
  </footer>

  <!-- REEMPLAZA DESDE AQUÍ -->
  <script>
    // Configuración: Tiempo máximo de inactividad permitido (Ejemplo: 30 minutos)
    const TIEMPO_MAXIMO_INACTIVIDAD = 30 * 60 * 1000; 

    // 1. COMPROBACIÓN EXTREMA AL CARGAR LA PÁGINA
    document.addEventListener("DOMContentLoaded", function() {
      // Evitar que el navegador cargue esta página desde la caché al usar las flechas
      window.history.pushState(null, null, window.location.href);
      
      const token = localStorage.getItem("token");
      const rol = localStorage.getItem("rol");
      const ultimaActividad = localStorage.getItem("ultimaActividad");
      const horaActual = new Date().getTime();

      if (token && rol && ultimaActividad) {
        // Verificar si la sesión ya caducó por tiempo prolongado
        if (horaActual - parseInt(ultimaActividad) > TIEMPO_MAXIMO_INACTIVIDAD) {
          alert("Tu sesión ha caducado por seguridad. Por favor, inicia sesión de nuevo.");
          cerrarSesionLimpio();
        } else {
          // Si todo está bien, actualizar el tiempo de vida y redirigir al panel correspondiente
          localStorage.setItem("ultimaActividad", horaActual);
          redirigirPorRol(rol);
        }
      } else {
        // Si no hay datos válidos, nos aseguramos de borrar cualquier residuo
        cerrarSesionLimpio();
      }
    });

    // 2. CONTROL TOTAL DE LAS FLECHAS DEL NAVEGADOR (BOTÓN ATRÁS)
    window.addEventListener("popstate", function () {
      // Si el usuario intenta regresar usando las flechas, lo forzamos a quedarse o desloguearse
      window.history.pushState(null, null, window.location.href);
    });

    // Función para limpiar credenciales de forma segura
    function cerrarSesionLimpio() {
      localStorage.removeItem("token");
      localStorage.removeItem("rol");
      localStorage.removeItem("ultimaActividad");
    }

  // Función centralizada para manejar las redirecciones
function redirigirPorRol(rol) {
  // Siempre redirigimos al mismo panel
  window.location.href = "panel.html";
}


    // 3. PROCESO DE LOGUEO
    document.getElementById("formLogin").addEventListener("submit", async function(e){
      e.preventDefault();
      const correo = document.getElementById("correo").value;
      const password = document.getElementById("password").value;

      try {
        const baseURL = window.location.origin;
        const res = await fetch(`${baseURL}/api/usuarios/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ correo, password })
        });
        const data = await res.json();

        if (data.success) {
          const horaLogueo = new Date().getTime();
          
          // Guardar credenciales y la estampa de tiempo inicial
          localStorage.setItem("token", data.data.token);
          localStorage.setItem("rol", data.data.usuario.rol);
          localStorage.setItem("ultimaActividad", horaLogueo);
          
          // Redirigir usando la función optimizada
          redirigirPorRol(data.data.usuario.rol);
        } else {
          alert("Credenciales inválidas: " + data.message);
        }
      } catch (err) {
        console.error("Error en login:", err);
        alert("Error de conexión con el servidor");
      } finally {
        // Limpiar campos siempre
        document.getElementById("correo").value = "";
        document.getElementById("password").value = "";
      }
    });
  </script>
  <!-- HASTA AQUÍ -->

</body>
</html>
