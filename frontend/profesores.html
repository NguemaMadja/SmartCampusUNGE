<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Profesores - SmartCampusUNGE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #003366, #004080);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      color: white;
    }
    .navbar { background-color: #004080; height: 60px; display: flex; align-items: center; }
    .scroll-msg { background-color: #008000; color: #fff; font-weight: bold; padding: 5px; flex: 1; margin: 0 60px; }
    .scroll-msg marquee { font-size: 1.1em; }
    .role-card {
      max-width: 700px;
      margin: 60px auto;
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      text-align: center;
      color: #000;
    }
    .role-card .btn { margin: 10px; width: 220px; }
    footer { background-color: #004080; color: white; padding: 15px; text-align: center; margin-top: auto; }
    .social-buttons .btn { margin: 5px; border-radius: 50%; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; }
    .btn-nav { background-color: #004080; color: white; border: none; margin: 5px; }
    .btn-nav:hover { background-color: #003366; color: #fff; }
  </style>
</head>
<body>
  <!-- Cabecera -->
  <nav class="navbar navbar-dark">
    <a class="navbar-brand d-flex align-items-center ms-3" href="index.html">
      <img src="logo/LOGO-UNGE-1.png" alt="Logo UNGE" class="img-fluid me-2" style="max-height:50px;">
      <span>SmartCampusUNGE</span>
    </a>
    <div class="scroll-msg text-center">
      <marquee behavior="scroll" direction="left" scrollamount="6">
        Panel de Profesores: acceso a módulos académicos y servicios
      </marquee>
    </div>
    <div class="dropdown superadmin-container">
      <button class="btn btn-danger dropdown-toggle" type="button" id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
        Superadmin
      </button>
      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
        <li><span class="dropdown-item-text" id="userId">ID: --</span></li>
        <li><span class="dropdown-item-text" id="userRole">Rol: --</span></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item text-danger" href="#" id="logoutBtn">Cerrar sesión</a></li>
      </ul>
    </div>
  </nav>

  <!-- Panel de Profesores -->
  <div class="role-card">
    <h3>Panel de Profesores</h3>
    <a href="radio.html" class="btn btn-success">Radio</a>
    <a href="transporte.html" class="btn btn-primary">Transporte</a>
    <a href="mapa.html" class="btn btn-info">Mapa UNGE</a>
    <a href="materiales.html" class="btn btn-warning">Materiales</a>
    <a href="metricas.html" class="btn btn-secondary">Métricas Ambientales/WiFi</a>
    <div class="mt-3">
      <button class="btn btn-nav" onclick="window.history.back()">Atrás</button>
      <button class="btn btn-nav" onclick="window.history.forward()">Adelante</button>
    </div>
  </div>

  <!-- Pie de página -->
  <footer>
    <p>TODOS LOS DERECHOS RESERVADOS © IoT A NUESTRO ALCANCE - UNGE 2026</p>
    <div class="social-buttons">
      <a href="#" class="btn btn-outline-light"><i class="bi bi-twitter"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-facebook"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-instagram"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-youtube"></i></a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Logout
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("token");
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
