<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Radio UNGE</title>
  <link href="https://jsdelivr.net" rel="stylesheet">
  <style>
    body {
      background: url("image/imge-unge5.jpg") no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .radio-card {
      max-width: 600px;
      margin: 60px auto;
      background: rgba(255,255,255,0.9);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .radio-card .btn {
      margin-top: 20px;
    }
    footer {
      background-color: #004080;
      color: white;
      padding: 15px;
      text-align: center;
      margin-top: auto;
    }
    .btn-audio-control {
      font-size: 1.25rem;
      padding: 12px;
      font-weight: bold;
      transition: all 0.2s ease-in-out;
    }
  </style>
</head>
<body>

  <!-- Cabecera -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark container">
      <a class="navbar-brand" href="index.html">UNGE - TODOS LOS CAMPUS</a>
      <div class="ms-auto">
        <a href="login.html" class="btn btn-outline-light me-2">Login</a>
        <a href="radio.html" class="btn btn-success">Radio UNGE</a>
      </div>
    </nav>
  </header>

  <!-- Reproductor de radio -->
  <div class="radio-card text-center">
    <h3>Radio UNGE en vivo</h3>
    
    <!-- Elemento de audio con parámetros de compatibilidad nativa para iOS y Android -->
    <audio 
      id="playerRadio" 
      preload="none" 
      playsinline="true" 
      webkit-playsinline="true">
    </audio>
    
    <!-- Botón interactivo que cumple con las directivas de seguridad móvil -->
    <button id="btnControlRadio" class="btn btn-success w-100 btn-audio-control my-3">
      ▶️ Escuchar Radio en Vivo
    </button>

    <!-- Botón de regreso al login -->
    <a href="login.html" target="_blank" class="btn btn-primary w-100">Ir al Login</a>
  </div>

  <!-- Pie de página -->
  <footer>
    <p>TODOS LOS DERECHOS RESERVADOS © IoT A NUESTRO ALCANCE - UNGE 2026</p>
  </footer>

  <!-- Script de Inyección e Interceptación de Tráfico Universal -->
  <script>
    // 1. AUTO-INSTALACIÓN DEL SERVICE WORKER
    // Este bloque genera un interceptor en caliente para inyectar las cabeceras requeridas por Ngrok.
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('fetch', event => {
          if (event.request.url.includes('ngrok-free.dev')) {
            // Clonamos la petición original para poder alterar sus cabeceras
            const modifiedHeaders = new Headers(event.request.headers);
            modifiedHeaders.set('ngrok-skip-browser-warning', 'true');
            
            const modifiedRequest = new Request(event.request, {
              headers: modifiedHeaders,
              mode: 'cors', // Forzar modo CORS para transmisiones multimedia cruzadas
              credentials: 'omit'
            });
            event.respondWith(fetch(modifiedRequest));
          }
        });
        self.addEventListener('activate', event => event.waitUntil(clients.claim()));
      `;
      
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      
      navigator.serviceWorker.register(swUrl, { scope: './' })
        .then(reg => console.log('Controlador de tráfico activado con éxito.'))
        .catch(err => console.error('Error al inicializar compatibilidad:', err));
    }

    // 2. CONTROL DEL REPRODUCTOR MULTIMEDIA
    document.addEventListener("DOMContentLoaded", function() {
      const audioPlayer = document.getElementById("playerRadio");
      const btnControl = document.getElementById("btnControlRadio");
      
      // La dirección IP del túnel Ngrok activa
      const streamUrl = "https://ngrok-free.dev";

      btnControl.addEventListener("click", function() {
        if (audioPlayer.paused || !audioPlayer.src || audioPlayer.src === window.location.href) {
          
          btnControl.innerHTML = "⏳ Conectando...";
          btnControl.disabled = true;

          // Asignamos la ruta limpia. El Service Worker se encargará de validar las credenciales de ngrok.
          audioPlayer.src = streamUrl;
          
          // Obligar al motor WebKit (Safari/iPhone) y Blink (Chrome/Android) a refrescar los códecs de audio
          audioPlayer.load();
          
          // Disparo de la transmisión protegido por promesas estándar
          audioPlayer.play()
            .then(() => {
              btnControl.disabled = false;
              btnControl.classList.remove("btn-success");
              btnControl.classList.add("btn-danger");
              btnControl.innerHTML = "⏸️ Pausar Radio";
            })
            .catch(error => {
              btnControl.disabled = false;
              btnControl.classList.remove("btn-danger");
              btnControl.classList.add("btn-success");
              btnControl.innerHTML = "▶️ Escuchar Radio en Vivo";
              console.error("Fallo técnico de hardware:", error);
              alert("Error de flujo. Por favor, asegúrate de que la transmisión esté activa en tu consola e inténtalo de nuevo.");
            });
            
        } else {
          // Detención segura: pausamos y reiniciamos el búfer sin destruir el elemento en iOS
          audioPlayer.pause();
          audioPlayer.src = "";
          audioPlayer.load();
          
          btnControl.classList.remove("btn-danger");
          btnControl.classList.add("btn-success");
          btnControl.innerHTML = "▶️ Escuchar Radio en Vivo";
        }
      });
    });
  </script>

</body>
</html>
