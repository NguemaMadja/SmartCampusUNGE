<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Radio UNGE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: url("image/imge-unge5.jpg") no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .radio-card {
      max-width: 600px;
      margin: 60px auto;
      background: rgba(255,255,255,0.9);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .radio-card .btn {
      margin-top: 20px;
    }
    footer {
      background-color: #004080;
      color: white;
      padding: 15px;
      text-align: center;
      margin-top: auto;
    }
    /* Estilo personalizado para nuestro botón de control */
    .btn-audio-control {
      font-size: 1.25rem;
      padding: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Cabecera -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark container">
      <a class="navbar-brand" href="index.html">UNGE - TODOS LOS CAMPUS</a>
      <div class="ms-auto">
        <a href="login.html" class="btn btn-outline-light me-2">Login</a>
        <a href="radio.html" class="btn btn-success">Radio UNGE</a>
      </div>
    </nav>
  </header>

  <!-- Reproductor de radio -->
  <div class="radio-card text-center">
    <h3>Radio UNGE en vivo</h3>
    
    <!-- CORRECCIÓN UNIVERSAL: Atributos crossorigin y playsinline para romper el bloqueo en otros dispositivos y móviles -->
    <audio 
      id="playerRadio" 
      preload="none" 
      crossorigin="anonymous" 
      playsinline="true" 
      webkit-playsinline="true">
    </audio>
    
    <!-- Botón interactivo obligatorio para la directiva de reproducción móvil -->
    <button id="btnControlRadio" class="btn btn-success w-100 btn-audio-control my-3">
      ▶️ Escuchar Radio en Vivo
    </button>

    <!-- Botón de regreso al login -->
    <a href="login.html" target="_blank" class="btn btn-primary w-100">Ir al Login</a>
  </div>

  <!-- Pie de página -->
  <footer>
    <p>TODOS LOS DERECHOS RESERVADOS © IoT A NUESTRO ALCANCE - UNGE 2026</p>
  </footer>

  <!-- Script optimizado para evadir restricciones móviles y saltar ngrok -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const audioPlayer = document.getElementById("playerRadio");
      const btnControl = document.getElementById("btnControlRadio");
      
      // La URL base generada por tu tunel ngrok
      const baseUrl = "https://diagnosis-shorty-privatize.ngrok-free.dev/radiounge";
      // Agregamos el bypass de ngrok directamente desde el inicio
      const streamUrl = baseUrl + "?ngrok-skip-browser-warning=true";

      btnControl.addEventListener("click", function() {
        if (audioPlayer.paused || audioPlayer.src === "" || audioPlayer.src === window.location.href) {
          
          btnControl.innerHTML = "⏳ Conectando...";
          btnControl.disabled = true;

          // 1. Asignamos la URL limpia con el bypass directamente en el click del usuario
          audioPlayer.src = streamUrl;
          audioPlayer.load();
          
          // 2. Ejecutamos la reproducción protegida por promesas (requerido por iOS/Android)
          audioPlayer.play()
            .then(() => {
              btnControl.disabled = false;
              btnControl.classList.remove("btn-success");
              btnControl.classList.add("btn-danger");
              btnControl.innerHTML = "⏸️ Pausar Radio";
            })
            .catch(error => {
              btnControl.disabled = false;
              btnControl.classList.remove("btn-danger");
              btnControl.classList.add("btn-success");
              btnControl.innerHTML = "▶️ Escuchar Radio en Vivo";
              console.error("Error al reproducir en el dispositivo:", error);
              alert("Error de conexión con el flujo de audio. Por favor, inténtalo de nuevo.");
            });
            
        } else {
          // 3. Pausamos y limpiamos el buffer de manera segura para evitar consumo de datos en segundo plano
          audioPlayer.pause();
          audioPlayer.src = ""; 
          audioPlayer.load();
          
          btnControl.classList.remove("btn-danger");
          btnControl.classList.add("btn-success");
          btnControl.innerHTML = "▶️ Escuchar Radio en Vivo";
        }
      });
    });
  </script>

</body>
</html>
