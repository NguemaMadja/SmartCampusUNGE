<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Radio UNGE</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: url("image/imge-unge5.jpg") no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .radio-card {
      max-width: 600px;
      margin: 60px auto;
      background: rgba(255,255,255,0.9);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .radio-card .btn {
      margin-top: 20px;
    }

    footer {
      background-color: #004080;
      color: white;
      padding: 15px;
      text-align: center;
      margin-top: auto;
    }

    .btn-audio-control {
      font-size: 1.25rem;
      padding: 12px;
      font-weight: bold;
    }

    .estado-radio {
      font-size: 14px;
      color: #555;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark container">
      <a class="navbar-brand" href="index.html">
        UNGE - TODOS LOS CAMPUS
      </a>

      <div class="ms-auto">
        <a href="login.html" class="btn btn-outline-light me-2">
          Login
        </a>

        <a href="radio.html" class="btn btn-success">
          Radio UNGE
        </a>
      </div>
    </nav>
  </header>

  <div class="radio-card text-center">

    <h3>📻 Radio UNGE en Vivo</h3>

    <audio
      id="playerRadio"
      preload="none">
    </audio>

    <button
      id="btnControlRadio"
      class="btn btn-success w-100 btn-audio-control my-3">

      ▶️ Escuchar Radio en Vivo

    </button>

    <div class="estado-radio" id="estadoRadio">
      Presione el botón para comenzar la reproducción.
    </div>

    <a
      href="login.html"
      target="_blank"
      class="btn btn-primary w-100">

      Ir al Login

    </a>

  </div>

  <footer>
    <p>
      TODOS LOS DERECHOS RESERVADOS © IoT A NUESTRO ALCANCE - UNGE 2026
    </p>
  </footer>

  <script>

    document.addEventListener("DOMContentLoaded", () => {

      const audioPlayer =
        document.getElementById("playerRadio");

      const btnControl =
        document.getElementById("btnControlRadio");

      const estadoRadio =
        document.getElementById("estadoRadio");

      let reproduciendo = false;

      btnControl.addEventListener("click", async () => {

        if (!reproduciendo) {

          try {

            const streamUrl =
              "https://radiounge.com/radiounge?t=" +
              Date.now();

            audioPlayer.src = streamUrl;

            audioPlayer.load();

            await audioPlayer.play();

            reproduciendo = true;

            btnControl.classList.remove(
              "btn-success"
            );

            btnControl.classList.add(
              "btn-danger"
            );

            btnControl.innerHTML =
              "⏸️ Pausar Radio";

            estadoRadio.innerHTML =
              "🟢 Conectado a Radio UNGE";

          }

          catch (error) {

            console.error(error);

            estadoRadio.innerHTML =
              "🔴 No se pudo conectar con la emisora.";

            alert(
              "Error al conectar con Radio UNGE."
            );

          }

        } else {

          audioPlayer.pause();

          audioPlayer.removeAttribute("src");

          audioPlayer.load();

          reproduciendo = false;

          btnControl.classList.remove(
            "btn-danger"
          );

          btnControl.classList.add(
            "btn-success"
          );

          btnControl.innerHTML =
            "▶️ Escuchar Radio en Vivo";

          estadoRadio.innerHTML =
            "⏹️ Reproducción detenida.";

        }

      });

      audioPlayer.addEventListener("error", () => {

        estadoRadio.innerHTML =
          "🔴 Error de transmisión.";

      });

    });

  </script>

</body>
</html>
