<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Radio UNGE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: url("image/imge-unge5.jpg") no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .radio-card {
      max-width: 600px;
      margin: 60px auto;
      background: rgba(255,255,255,0.9);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .radio-card .btn {
      margin-top: 20px;
    }
    footer {
      background-color: #004080;
      color: white;
      padding: 15px;
      text-align: center;
      margin-top: auto;
    }
    /* Estilo personalizado para nuestro botón de control */
    .btn-audio-control {
      font-size: 1.25rem;
      padding: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Cabecera -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark container">
      <a class="navbar-brand" href="index.html">UNGE - TODOS LOS CAMPUS</a>
      <div class="ms-auto">
        <a href="login.html" class="btn btn-outline-light me-2">Login</a>
        <a href="radio.html" class="btn btn-success">Radio UNGE</a>
      </div>
    </nav>
  </header>

  <!-- Reproductor de radio -->
  <div class="radio-card text-center">
    <h3>Radio UNGE en vivo</h3>
    
    <!-- Elemento de audio invisible / Sin controles nativos conflictivos en móvil -->
    <audio id="playerRadio" preload="none"></audio>
    
    <!-- Botón interactivo obligatorio para la directiva de reproducción móvil -->
    <button id="btnControlRadio" class="btn btn-success w-100 btn-audio-control my-3">
      ▶️ Escuchar Radio en Vivo
    </button>

    <!-- Botón de regreso al login -->
    <a href="login.html" target="_blank" class="btn btn-primary w-100">Ir al Login</a>
  </div>

  <!-- Pie de página -->
  <footer>
    <p>TODOS LOS DERECHOS RESERVADOS © IoT A NUESTRO ALCANCE - UNGE 2026</p>
  </footer>

  <!-- Script optimizado para evadir restricciones móviles y saltar ngrok -->

  
  <script>
  document.addEventListener("DOMContentLoaded", function() {
    const audioPlayer = document.getElementById("playerRadio");
    const btnControl = document.getElementById("btnControlRadio");
    
    const baseUrl = "https://ngrok-free.dev";
    const streamUrl = baseUrl + "?ngrok-skip-browser-warning=true";

    // Atributos universales para máxima compatibilidad móvil (Android e iOS)
    audioPlayer.setAttribute("playsinline", "true");
    audioPlayer.setAttribute("webkit-playsinline", "true");
    audioPlayer.preload = "none";

    btnControl.addEventListener("click", function() {
      if (audioPlayer.paused || audioPlayer.src === "") {
        
        btnControl.innerHTML = "⏳ Conectando a Radio UNGE...";
        btnControl.disabled = true;

        // Asignamos la ruta con el bypass de ngrok
        audioPlayer.src = streamUrl;
        audioPlayer.load();
        
        // Intento de reproducción estándar universal protegido por promesas
        audioPlayer.play()
          .then(() => {
            // FUNCIONA EN CUALQUIER DISPOSITIVO (Android, PC, o iOS con cookie activa)
            btnControl.disabled = false;
            btnControl.classList.remove("btn-success");
            btnControl.classList.add("btn-danger");
            btnControl.innerHTML = "⏸️ Pausar Radio";
          })
          .catch(error => {
            // SI FALLA (Principalmente en iPhones o navegadores hiper-seguros debido a Ngrok)
            btnControl.disabled = false;
            btnControl.classList.remove("btn-danger");
            btnControl.classList.add("btn-success");
            btnControl.innerHTML = "▶️ Escuchar Radio en Vivo";
            
            console.error("Error de reproducción multimedia:", error);

            // Plan de contingencia universal para el bloqueo de Ngrok
            if (confirm("Para escuchar la radio en este dispositivo, el servidor de pruebas (Ngrok) requiere una validación rápida. ¿Deseas activarla ahora?")) {
              window.open(streamUrl, '_blank');
            }
          });
          
      } else {
        // Pausa limpia y universal (libera memoria y datos en cualquier móvil)
        audioPlayer.pause();
        audioPlayer.src = "";
        audioPlayer.load(); 
        
        btnControl.classList.remove("btn-danger");
        btnControl.classList.add("btn-success");
        btnControl.innerHTML = "▶️ Escuchar Radio en Vivo";
      }
    });
  });
</script>
