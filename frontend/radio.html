<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Radio UNGE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: url("image/imge-unge5.jpg") no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .radio-card {
      max-width: 600px;
      margin: 60px auto;
      background: rgba(255,255,255,0.9);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .radio-card .btn {
      margin-top: 20px;
    }
    footer {
      background-color: #004080;
      color: white;
      padding: 15px;
      text-align: center;
      margin-top: auto; /* empuja el footer al fondo */
    }
  </style>
</head>
<body>

  <!-- Cabecera -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark container">
      <a class="navbar-brand" href="index.html">UNGE - TODOS LOS CAMPUS</a>
      <div class="ms-auto">
        <a href="login.html" class="btn btn-outline-light me-2">Login</a>
        <a href="radio.html" class="btn btn-success">Radio UNGE</a>
      </div>
    </nav>
  </header>

  <!-- Reproductor de radio -->
  <div class="radio-card text-center">
    <h3>Radio UNGE en vivo</h3>
    <audio id="playerRadio" controls autoplay>
      <source src="https://diagnosis-shorty-privatize.ngrok-free.dev/radiounge" type="audio/mpeg">
      Tu navegador no soporta audio HTML5.
    </audio>
    <!-- Botón de regreso al login -->
    <a href="login.html" target="_blank" class="btn btn-primary w-100">Ir al Login</a>
  </div>

  <!-- Pie de página -->
  <footer>
    <p>TODOS LOS DERECHOS RESERVADOS © IoT A NUESTRO ALCANCE - UNGE 2026</p>
  </footer>

  <!-- Script para solucionar la reproducción en teléfonos móviles con Ngrok -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var audioPlayer = document.getElementById("playerRadio");
      if (audioPlayer) {
        var sourceElement = audioPlayer.querySelector("source");
        if (sourceElement) {
          var currentSrc = sourceElement.src;
          // Inyecta dinámicamente el parámetro para evadir la pantalla intermedia de ngrok
          if (!currentSrc.includes("ngrok-skip-browser-warning")) {
            sourceElement.src = currentSrc + "?ngrok-skip-browser-warning=true";
            audioPlayer.load(); // Fuerza al reproductor a refrescar la ruta en móviles
          }
        }
      }
    });
  </script>

</body>
</html>
