<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Radio UNGE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: url("image/imge-unge5.jpg") no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .radio-card {
      max-width: 600px;
      margin: 60px auto;
      background: rgba(255,255,255,0.9);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .radio-card .btn {
      margin-top: 20px;
    }
    footer {
      background-color: #004080;
      color: white;
      padding: 15px;
      text-align: center;
      margin-top: auto;
    }
    /* Estilo personalizado para nuestro botón de control */
    .btn-audio-control {
      font-size: 1.25rem;
      padding: 12px;
      font-weight: bold;
      transition: all 0.2s ease-in-out;
    }
  </style>
</head>
<body>

  <!-- Cabecera -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark container">
      <a class="navbar-brand" href="index.html">UNGE - TODOS LOS CAMPUS</a>
      <div class="ms-auto">
        <a href="login.html" class="btn btn-outline-light me-2">Login</a>
        <a href="radio.html" class="btn btn-success">Radio UNGE</a>
      </div>
    </nav>
  </header>

  <!-- Reproductor de radio -->
  <div class="radio-card text-center">
    <h3>Radio UNGE en vivo</h3>
    
    <!-- Elemento de audio con parámetros universales embebidos de manera fija -->
    <audio 
      id="playerRadio" 
      preload="none" 
      playsinline="true" 
      webkit-playsinline="true"
      src="https://ngrok-free.dev">
    </audio>
    
    <!-- Botón interactivo compatible con las directivas de seguridad móvil -->
    <button id="btnControlRadio" class="btn btn-success w-100 btn-audio-control my-3">
      ▶️ Escuchar Radio en Vivo
    </button>

    <!-- Botón de regreso al login -->
    <a href="login.html" target="_blank" class="btn btn-primary w-100">Ir al Login</a>
  </div>

  <!-- Pie de página -->
  <footer>
    <p>TODOS LOS DERECHOS RESERVADOS © IoT A NUESTRO ALCANCE - UNGE 2026</p>
  </footer>

  <!-- Script Universal de Compatibilidad Multimedia Móvil -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const audioPlayer = document.getElementById("playerRadio");
      const btnControl = document.getElementById("btnControlRadio");
      
      // Conservamos la URL limpia para re-conexiones estables en móviles
      const streamUrl = "https://ngrok-free.dev";

      btnControl.addEventListener("click", function() {
        // Verificamos si está pausado o si se necesita inicializar el origen
        if (audioPlayer.paused || !audioPlayer.src || audioPlayer.src === window.location.href) {
          
          btnControl.innerHTML = "⏳ Conectando...";
          btnControl.disabled = true;

          // Aseguramos que la URL del streaming sea la correcta antes de la carga
          audioPlayer.src = streamUrl;
          
          // Solución para iPhone: Forzar la lectura atómica del flujo de audio en vivo
          audioPlayer.load();
          
          // Ejecución del hilo de reproducción controlado por promesas estándar
          audioPlayer.play()
            .then(() => {
              btnControl.disabled = false;
              btnControl.classList.remove("btn-success");
              btnControl.classList.add("btn-danger");
              btnControl.innerHTML = "⏸️ Pausar Radio";
            })
            .catch(error => {
              btnControl.disabled = false;
              btnControl.classList.remove("btn-danger");
              btnControl.classList.add("btn-success");
              btnControl.innerHTML = "▶️ Escuchar Radio en Vivo";
              console.error("Fallo de reproducción en dispositivo:", error);
              alert("Asegúrate de que el servidor de la radio esté encendido y vuelve a intentarlo.");
            });
            
        } else {
          // Pausa limpia: detenemos el reproductor de forma nativa
          audioPlayer.pause();
          
          // En streams continuos de móviles, en lugar de vaciar la URL (lo que rompe iOS),
          // forzamos un rebobinado lógico cargando un estado nulo controlado.
          audioPlayer.src = "";
          
          btnControl.classList.remove("btn-danger");
          btnControl.classList.add("btn-success");
          btnControl.innerHTML = "▶️ Escuchar Radio en Vivo";
        }
      });
    });
  </script>

</body>
</html>
