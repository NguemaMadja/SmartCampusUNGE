<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Radio UNGE</title>
  <link href="https://jsdelivr.net" rel="stylesheet">
  <style>
    body {
      background: url("image/imge-unge5.jpg") no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .radio-card {
      max-width: 600px;
      margin: 60px auto;
      background: rgba(255,255,255,0.9);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .radio-card .btn {
      margin-top: 20px;
    }
    footer {
      background-color: #004080;
      color: white;
      padding: 15px;
      text-align: center;
      margin-top: auto;
    }
    /* Estilo personalizado para nuestro botón de control */
    .btn-audio-control {
      font-size: 1.25rem;
      padding: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Cabecera -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark container">
      <a class="navbar-brand" href="index.html">UNGE - TODOS LOS CAMPUS</a>
      <div class="ms-auto">
        <a href="login.html" class="btn btn-outline-light me-2">Login</a>
        <a href="radio.html" class="btn btn-success">Radio UNGE</a>
      </div>
    </nav>
  </header>

  <!-- Reproductor de radio -->
  <div class="radio-card text-center">
    <h3>Radio UNGE en vivo</h3>
    
    <!-- Elemento de audio preparado para recibir el flujo universal convertido -->
    <audio 
      id="playerRadio" 
      preload="none" 
      crossorigin="anonymous"
      playsinline="true" 
      webkit-playsinline="true">
    </audio>
    
    <!-- Botón interactivo obligatorio para la directiva de reproducción móvil -->
    <button id="btnControlRadio" class="btn btn-success w-100 btn-audio-control my-3">
      ▶️ Escuchar Radio en Vivo
    </button>

    <!-- Botón de regreso al login -->
    <a href="login.html" target="_blank" class="btn btn-primary w-100">Ir al Login</a>
  </div>

  <!-- Pie de página -->
  <footer>
    <p>TODOS LOS DERECHOS RESERVADOS © IoT A NUESTRO ALCANCE - UNGE 2026</p>
  </footer>

  <!-- Script con bypass HTTP de bajo nivel para compatibilidad total -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const audioPlayer = document.getElementById("playerRadio");
      const btnControl = document.getElementById("btnControlRadio");
      
      const streamUrl = "https://ngrok-free.dev";
      let objectURL = null;
      let abortController = null;

      btnControl.addEventListener("click", async function() {
        if (audioPlayer.paused || btnControl.classList.contains("btn-success")) {
          
          btnControl.innerHTML = "⏳ Conectando...";
          btnControl.disabled = true;

          // Cancelamos cualquier petición previa colgada
          if (abortController) abortController.abort();
          abortController = new AbortController();

          try {
            // SOLUCIÓN ATÓMICA: Forzamos la descarga del audio inyectando la cabecera directamente por código
            const response = await fetch(streamUrl, {
              headers: { 'ngrok-skip-browser-warning': 'true' },
              signal: abortController.signal
            });

            if (!response.ok) throw new Error("Servidor fuera de línea");

            // Convertimos la respuesta continua de ngrok en un objeto URL nativo que cualquier móvil acepta
            const reader = response.body.getReader();
            const stream = new ReadableStream({
              start(controller) {
                function push() {
                  reader.read().then(({ done, value }) => {
                    if (done) {
                      controller.close();
                      return;
                    }
                    controller.enqueue(value);
                    push();
                  });
                }
                push();
              }
            });

            const responseStream = new Response(stream, { headers: { "Content-Type": "audio/mpeg" } });
            const blob = await responseStream.blob();
            
            // Creamos una URL local temporal que burla las restricciones CORS del iPhone y Android
            if (objectURL) URL.revokeObjectURL(objectURL);
            objectURL = URL.createObjectURL(blob);
            
            audioPlayer.src = objectURL;
            audioPlayer.load();

            await audioPlayer.play();
            
            btnControl.disabled = false;
            btnControl.classList.remove("btn-success");
            btnControl.classList.add("btn-danger");
            btnControl.innerHTML = "⏸️ Pausar Radio";

          } catch (error) {
            btnControl.disabled = false;
            btnControl.classList.remove("btn-danger");
            btnControl.classList.add("btn-success");
            btnControl.innerHTML = "▶️ Escuchar Radio en Vivo";
            console.error("Error de Red / CORS bypass:", error);
            alert("Error de conexión. Por favor, asegúrate de que el streaming esté activo en tu consola.");
          }
            
        } else {
          // Detención e higienización completa del búfer de datos
          if (abortController) abortController.abort();
          audioPlayer.pause();
          audioPlayer.src = "";
          audioPlayer.load();
          if (objectURL) URL.revokeObjectURL(objectURL);
          
          btnControl.classList.remove("btn-danger");
          btnControl.classList.add("btn-success");
          btnControl.innerHTML = "▶️ Escuchar Radio en Vivo";
        }
      });
    });
  </script>

</body>
</html>
