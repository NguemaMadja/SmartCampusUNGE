<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asignaturas - SmartCampusUNGE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #003366, #004080); color: white; min-height: 100vh; display: flex; flex-direction: column; }
    .navbar { background-color: #004080; height: 60px; display: flex; align-items: center; }
    .scroll-msg { background-color: #008000; color: #fff; font-weight: bold; padding: 5px; flex: 1; margin: 0 60px; }
    .scroll-msg marquee { font-size: 1.1em; }
    .container-main { flex: 1; padding: 20px; }
    footer { background-color: #004080; color: white; padding: 15px; text-align: center; margin-top: auto; }
    .social-buttons .btn { margin: 5px; border-radius: 50%; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; }
    .btn-nav { background-color: #006400; color: #fff; border-radius: 8px; padding: 8px 20px; margin: 5px; transition: 0.3s; }
    .btn-nav:hover { background-color: #004d26; transform: scale(1.05); }
    .search-box { margin-bottom: 15px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark">
    <a class="navbar-brand d-flex align-items-center ms-3" href="index.html">
      <img src="logo/LOGO-UNGE-1.png" alt="Logo UNGE" class="img-fluid me-2" style="max-height:50px;">
      <span>SmartCampusUNGE</span>
    </a>
    <div class="scroll-msg text-center">
      <marquee behavior="scroll" direction="left" scrollamount="6">
        Gestión de Asignaturas: administración y control académico
      </marquee>
    </div>
    <div class="dropdown me-3">
      <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">Usuario Conectado</button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="#">ID: 12345</a></li>
        <li><a class="dropdown-item" href="#">Nombre: Profesor UNGE</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item text-danger" href="logout.html">Cerrar Sesión</a></li>
      </ul>
    </div>
  </nav>
  <div class="container-main container">
    <h2 class="text-center text-white mb-4">Asignaturas</h2>
    <div class="text-center mb-4">
      <button class="btn-nav" onclick="window.history.back()"><i class="bi bi-arrow-left-circle"></i> Atrás</button>
      <button class="btn-nav" onclick="window.history.forward()"><i class="bi bi-arrow-right-circle"></i> Adelante</button>
    </div>
    <div class="search-box text-center">
      <input type="text" id="buscarAsignatura" class="form-control w-50 mx-auto" placeholder="Buscar asignatura...">
    </div>
    <div class="card">
      <div class="card-header bg-primary text-white">Listado de Asignaturas</div>
      <div class="card-body">
        <table class="table table-striped table-hover text-dark" id="tablaAsignaturas">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>ID Carrera</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <button class="btn btn-success mt-3" data-bs-toggle="modal" data-bs-target="#modalAsignatura"><i class="bi bi-plus-circle"></i> Nueva Asignatura</button>
      </div>
    </div>
  </div>
  <div class="modal fade" id="modalAsignatura" tabindex="-1">
    <div class="modal-dialog">
      <form id="formAsignatura" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Gestión de Asignatura</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="asignaturaId">
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre de la Asignatura</label>
            <input type="text" id="nombre" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="id_carrera" class="form-label">ID Carrera</label>
            <input type="number" id="id_carrera" class="form-control" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Guardar</button>
        </div>
      </form>
    </div>
  </div>
  <footer>
    <p>TODOS LOS DERECHOS RESERVADOS © IoT A NUESTRO ALCANCE - UNGE 2026</p>
    <div class="social-buttons">
      <a href="#" class="btn btn-outline-light"><i class="bi bi-twitter"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-facebook"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-instagram"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-youtube"></i></a>
    </div>
  </footer>
  <script>
    const API_BASE = "https://smartcampusunge.onrender.com";

    // Cargar asignaturas desde la API
    async function cargarAsignaturas() {
      try {
        const res = await fetch(`${API_BASE}/api/asignaturas`);
        if (!res.ok) throw new Error(`Error HTTP: ${res.status}`);
        const data = await res.json();

        const tbody = document.querySelector('#tablaAsignaturas tbody');
        tbody.innerHTML = '';

        if (Array.isArray(data.data)) {
          data.data.forEach(a => {
            tbody.innerHTML += `
              <tr>
                <td>${a.id_asignatura}</td>
                <td>${a.nombre}</td>
                <td>${a.id_carrera}</td>
                <td>
                  <button class="btn btn-sm btn-warning" onclick="editarAsignatura(${a.id_asignatura}, '${a.nombre}', ${a.id_carrera})"><i class="bi bi-pencil"></i></button>
                  <button class="btn btn-sm btn-danger" onclick="eliminarAsignatura(${a.id_asignatura})"><i class="bi bi-trash"></i></button>
                </td>
              </tr>`;
          });
        } else {
          console.warn("La respuesta no contiene un array en data.data:", data);
        }
      } catch (err) {
        console.error("Error cargando asignaturas:", err);
      }
    }

    // Guardar asignatura (crear/editar)
    document.getElementById('formAsignatura').addEventListener('submit', async e => {
      e.preventDefault();
      const id = document.getElementById('asignaturaId').value;
      const nombre = document.getElementById('nombre').value.trim();
      const id_carrera = document.getElementById('id_carrera').value;

      if (nombre.length < 3) {
        alert("El nombre debe tener al menos 3 caracteres.");
        return;
      }
      if (!id_carrera || id_carrera < 1) {
        alert("Debe ingresar un ID de carrera válido.");
        return;
      }

      const url = id ? `${API_BASE}/api/asignaturas/${id}` : `${API_BASE}/api/asignaturas`;
      const method = id ? 'PUT' : 'POST';
      await fetch(url, { 
        method, 
        headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify({ nombre, id_carrera }) 
      });
      cargarAsignaturas();
      document.getElementById('formAsignatura').reset();
      bootstrap.Modal.getInstance(document.getElementById('modalAsignatura')).hide();
    });

    // Editar asignatura
    function editarAsignatura(id, nombre, id_carrera) {
      document.getElementById('asignaturaId').value = id;
      document.getElementById('nombre').value = nombre;
      document.getElementById('id_carrera').value = id_carrera;
      new bootstrap.Modal(document.getElementById('modalAsignatura')).show();
    }

    // Eliminar asignatura
    async function eliminarAsignatura(id) {
      if (confirm('¿Seguro que deseas eliminar esta asignatura?')) {
        await fetch(`${API_BASE}/api/asignaturas/${id}`, { method: 'DELETE' });
        cargarAsignaturas();
      }
    }

    // Buscador elegante
    document.getElementById('buscarAsignatura').addEventListener('keyup', () => {
      const filtro = document.getElementById('buscarAsignatura').value.toLowerCase();
      const filas = document.querySelectorAll('#tablaAsignaturas tbody tr');
      filas.forEach(fila => {
        const texto = fila.textContent.toLowerCase();
        fila.style.display = texto.includes(filtro) ? '' : 'none';
      });
    });

    // Inicializar
    cargarAsignaturas();
  </script>
</body>
</html>
