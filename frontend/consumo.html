<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Consumo Energético - SmartCampusUNGE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #003366, #004080); color: white; min-height: 100vh; display: flex; flex-direction: column; }
    .navbar { background-color: #004080; height: 60px; display: flex; align-items: center; }
    .scroll-msg { background-color: #008000; color: #fff; font-weight: bold; padding: 5px; flex: 1; margin: 0 60px; }
    .scroll-msg marquee { font-size: 1.1em; }
    .container-main { flex: 1; padding: 20px; }
    footer { background-color: #004080; color: white; padding: 15px; text-align: center; margin-top: auto; }
    .social-buttons .btn { margin: 5px; border-radius: 50%; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; }
    .btn-nav { background-color: #006400; color: #fff; border-radius: 8px; padding: 8px 20px; margin: 5px; transition: 0.3s; }
    .btn-nav:hover { background-color: #004d26; transform: scale(1.05); }
  </style>
</head>
<body>
  <!-- Cabecera -->
  <nav class="navbar navbar-dark">
    <a class="navbar-brand d-flex align-items-center ms-3" href="index.html">
      <img src="logo/LOGO-UNGE-1.png" alt="Logo UNGE" class="img-fluid me-2" style="max-height:50px;">
      <span>SmartCampusUNGE</span>
    </a>
    <div class="scroll-msg text-center">
      <marquee behavior="scroll" direction="left" scrollamount="6">
        Consumo Energético: métricas y análisis inteligente
      </marquee>
    </div>
    <div class="dropdown me-3">
      <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">Usuario Conectado</button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="#">ID: 12345</a></li>
        <li><a class="dropdown-item" href="#">Nombre: Profesor UNGE</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item text-danger" href="logout.html">Cerrar Sesión</a></li>
      </ul>
    </div>
  </nav>
  <!-- Contenido principal -->
  <div class="container-main container">
    <h2 class="text-center text-white mb-4">Consumo Energético</h2>

    <!-- Botones de navegación -->
    <div class="text-center mb-4">
      <button class="btn-nav" onclick="window.location.href='gestion_energetica.html'">
        <i class="bi bi-lightning-charge"></i> Estado de Aulas
      </button>
      <button class="btn-nav" onclick="window.location.href='consumo.html'">
        <i class="bi bi-bar-chart-line"></i> Consumo Energético
      </button>
      <button class="btn-nav" onclick="window.location.href='eventos.html'">
        <i class="bi bi-clock-history"></i> Eventos Energéticos
      </button>
      <button class="btn-nav" onclick="window.location.href='lecturas.html'">
        <i class="bi bi-list-columns"></i> Lecturas de Sensores
      </button>
    </div>

    <!-- Tabla de consumo -->
    <div class="card">
      <div class="card-header bg-primary text-white">Histórico de Consumo</div>
      <div class="card-body">
        <table class="table table-striped table-hover text-dark" id="tablaConsumo">
          <thead class="table-dark">
            <tr>
              <th>Aula</th>
              <th>Consumo (kWh)</th>
              <th>Fecha/Hora</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>


  <!-- Footer -->
  <footer>
    <p>TODOS LOS DERECHOS RESERVADOS © IoT A NUESTRO ALCANCE - UNGE 2026</p>
    <div class="social-buttons">
      <a href="#" class="btn btn-outline-light"><i class="bi bi-twitter"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-facebook"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-instagram"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-youtube"></i></a>
    </div>
  </footer>

  <!-- Librerías externas -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.bootstrap5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Script principal -->
  <script>
    const API_BASE = "https://smartcampusunge.onrender.com";

    // Inicializar DataTable con exportación
    const tabla = $('#tablaConsumo').DataTable({
      dom: 'Bfrtip',
      buttons: [
        { extend: 'excelHtml5', text: 'Exportar a Excel', className: 'btn btn-success' },
        { extend: 'pdfHtml5', text: 'Exportar a PDF', className: 'btn btn-danger' },
        { extend: 'print', text: 'Imprimir', className: 'btn btn-info' }
      ],
      language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' }
    });

    // Cargar consumos desde la API
    async function cargarConsumos() {
      try {
        const res = await fetch(`${API_BASE}/api/consumo_energia_sensores`);
        if (!res.ok) throw new Error(`Error HTTP: ${res.status}`);
        const data = await res.json();

        tabla.clear();
        const labels = [];
        const valores = [];

        if (Array.isArray(data.data)) {
          data.data.forEach(c => {
            tabla.row.add([
              c.nombre_aula,         // Aula
              c.energia_kwh,         // Consumo en kWh
              c.fecha_hora           // Fecha/Hora
            ]);
            labels.push(c.fecha_hora);
            valores.push(parseFloat(c.energia_kwh)); // convertir a número
          });
        }
        tabla.draw();

        // Calcular métricas
        const totalConsumo = valores.reduce((a,b) => a+b, 0);
        const promedioConsumo = valores.length ? (totalConsumo / valores.length).toFixed(2) : 0;

        // Mostrar métricas en consola (puedes añadir cards en HTML si quieres)
        console.log("Total consumo:", totalConsumo, "kWh");
        console.log("Promedio consumo:", promedioConsumo, "kWh");

        // Gráfico de consumo
        const ctx = document.getElementById('graficoConsumo').getContext('2d');
        new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: 'Consumo (kWh)',
              data: valores,
              borderColor: '#00ff99',
              backgroundColor: 'rgba(0,255,153,0.2)',
              fill: true,
              tension: 0.3
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { labels: { color: 'white' } },
              title: { display: true, text: 'Evolución del Consumo Energético', color: 'white' }
            },
            scales: {
              x: { ticks: { color: 'white' } },
              y: { ticks: { color: 'white' } }
            }
          }
        });
      } catch (err) {
        console.error("Error cargando consumos:", err);
      }
    }

    // Inicializar
    $(document).ready(() => {
      // Crear canvas para gráfico
      const graficoDiv = document.createElement('div');
      graficoDiv.className = "card mt-4";
      graficoDiv.innerHTML = `
        <div class="card-header bg-success text-white">Gráfico de Consumo</div>
        <div class="card-body"><canvas id="graficoConsumo" height="100"></canvas></div>
      `;
      document.querySelector('.container-main').appendChild(graficoDiv);

      cargarConsumos();
    });
  </script>
</body>
</html>
