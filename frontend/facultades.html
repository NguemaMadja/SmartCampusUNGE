<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Facultades - SmartCampusUNGE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #003366, #004080); color: white; min-height: 100vh; display: flex; flex-direction: column; }
    .navbar { background-color: #004080; height: 60px; display: flex; align-items: center; }
    .scroll-msg { background-color: #008000; color: #fff; font-weight: bold; padding: 5px; flex: 1; margin: 0 60px; }
    .scroll-msg marquee { font-size: 1.1em; }
    .container-main { flex: 1; padding: 20px; }
    footer { background-color: #004080; color: white; padding: 15px; text-align: center; margin-top: auto; }
    .social-buttons .btn { margin: 5px; border-radius: 50%; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; }
    .btn-nav { background-color: #006400; color: #fff; border-radius: 8px; padding: 8px 20px; margin: 5px; transition: 0.3s; }
    .btn-nav:hover { background-color: #004d26; transform: scale(1.05); }
    .search-box { margin-bottom: 15px; }
  </style>
</head>
<body>
  <!-- Cabecera -->
  <nav class="navbar navbar-dark">
    <a class="navbar-brand d-flex align-items-center ms-3" href="index.html">
      <img src="logo/LOGO-UNGE-1.png" alt="Logo UNGE" class="img-fluid me-2" style="max-height:50px;">
      <span>SmartCampusUNGE</span>
    </a>
    <div class="scroll-msg text-center">
      <marquee behavior="scroll" direction="left" scrollamount="6">
        Gestión de Facultades: administración y control académico
      </marquee>
    </div>
    <div class="dropdown me-3">
      <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">Usuario Conectado</button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="#">ID: 12345</a></li>
        <li><a class="dropdown-item" href="#">Nombre: Profesor UNGE</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item text-danger" href="logout.html">Cerrar Sesión</a></li>
      </ul>
    </div>
  </nav>

  <!-- Contenido principal -->
  <div class="container-main container">
    <h2 class="text-center text-white mb-4">Facultades</h2>

    <!-- Botones de navegación -->
    <div class="text-center mb-4">
      <button class="btn-nav" onclick="window.history.back()"><i class="bi bi-arrow-left-circle"></i> Atrás</button>
      <button class="btn-nav" onclick="window.history.forward()"><i class="bi bi-arrow-right-circle"></i> Adelante</button>
    </div>
    <!-- Buscador -->
    <div class="search-box text-center">
      <input type="text" id="buscarFacultad" class="form-control w-50 mx-auto" placeholder="Buscar facultad...">
    </div>

    <!-- Tabla -->
    <div class="card">
      <div class="card-header bg-primary text-white">Listado de Facultades</div>
      <div class="card-body">
        <table class="table table-striped table-hover text-dark" id="tablaFacultades">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <button class="btn btn-success mt-3" data-bs-toggle="modal" data-bs-target="#modalFacultad"><i class="bi bi-plus-circle"></i> Nueva Facultad</button>
      </div>
    </div>
  </div>

  <!-- Modal CRUD -->
  <div class="modal fade" id="modalFacultad" tabindex="-1">
    <div class="modal-dialog">
      <form id="formFacultad" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Gestión de Facultad</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="facultadId">
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre de Facultad</label>
            <input type="text" id="nombre" class="form-control" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Guardar</button>
        </div>
      </form>
    </div>
  </div>
  <!-- Footer -->
  <footer>
    <p>TODOS LOS DERECHOS RESERVADOS © IoT A NUESTRO ALCANCE - UNGE 2026</p>
    <div class="social-buttons">
      <a href="#" class="btn btn-outline-light"><i class="bi bi-twitter"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-facebook"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-instagram"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-youtube"></i></a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_BASE = "https://smartcampusunge.onrender.com";

    async function cargarFacultades() {
      const res = await fetch(`${API_BASE}/api/facultades`);
      const data = await res.json();
      const tbody = document.querySelector('#tablaFacultades tbody');
      tbody.innerHTML = '';
      data.data.forEach(f => {
        tbody.innerHTML += `
          <tr>
            <td>${f.id_facultad}</td>
            <td>${f.nombre}</td>
            <td>
              <button class="btn btn-sm btn-warning" onclick="editarFacultad(${f.id_facultad}, '${f.nombre}')"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm btn-danger" onclick="eliminarFacultad(${f.id_facultad})"><i class="bi bi-trash"></i></button>
            </td>
          </tr>`;
      });
    }

    document.getElementById('formFacultad').addEventListener('submit', async e => {
      e.preventDefault();
      const id = document.getElementById('facultadId').value;
      const nombre = document.getElementById('nombre').value;
      const url = id ? `${API_BASE}/api/facultades/${id}` : `${API_BASE}/api/facultades`;
      const method = id ? 'PUT' : 'POST';
      await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nombre }) });
      cargarFacultades();
      document.getElementById('formFacultad').reset();
      bootstrap.Modal.getInstance(document.getElementById('modalFacultad')).hide();
    });

    function editarFacultad(id, nombre) {
      document.getElementById('facultadId').value = id;
      document.getElementById('nombre').value = nombre;
      new bootstrap.Modal(document.getElementById('modalFacultad')).show();
    }

    async function eliminarFacultad(id) {
      if (confirm('¿Seguro que deseas eliminar esta facultad?')) {
        await fetch(`${API_BASE}/api/facultades/${id}`, { method: 'DELETE' });
        cargarFacultades();
      }
    }

    // Buscador elegante
    document.getElementById('buscarFacultad').addEventListener('keyup', () => {
      const filtro = document.getElementById('buscarFacultad').value.toLowerCase();
      const filas = document.querySelectorAll('#tablaFacultades tbody tr');
      filas.forEach(fila => {
        const texto = fila.textContent.toLowerCase();
        fila.style.display = texto.includes(filtro) ? '' : 'none';
      });
    });

    // Inicializar
    cargarFacultades();
  </script>
</body>
</html>
