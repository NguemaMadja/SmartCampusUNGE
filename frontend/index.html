<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SmartCampusUNGE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: rgba(0, 64, 128, 0.85);
    }
    .navbar-brand img {
      max-height: 60px;
    }
    .carousel-item img {
      max-height: 500px;
      width: 100%;
      object-fit: contain;
      border-radius: 10px;
      background-color: #fff;
    }
    footer {
      background-color: #004080;
      color: white;
      padding: 15px;
      text-align: center;
      margin-top: auto;
    }
    .social-buttons .btn {
      margin: 5px;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-login {
      background-color: #004080;
      color: white;
      border: none;
    }
    .btn-login:hover {
      background-color: #003366;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Cabecera con logo en esquina -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="logo/LOGO-UNGE-1.png" alt="Logo UNGE" class="img-fluid me-2">
        <span>SmartCampusUNGE</span>
      </a>
      <div class="ms-auto">
        <a href="login.html" class="btn btn-login me-2">Login</a>
        <a href="radio.html" class="btn btn-success">
          <i class="bi bi-broadcast"></i> Radio UNGE
        </a>
      </div>
    </nav>
  </header>

  <!-- Slider con fotos -->
  <div id="ungeCarousel" class="carousel slide mt-4 container" data-bs-ride="carousel">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#ungeCarousel" data-bs-slide-to="0" class="active"></button>
      <button type="button" data-bs-target="#ungeCarousel" data-bs-slide-to="1"></button>
      <button type="button" data-bs-target="#ungeCarousel" data-bs-slide-to="2"></button>
      <button type="button" data-bs-target="#ungeCarousel" data-bs-slide-to="3"></button>
      <button type="button" data-bs-target="#ungeCarousel" data-bs-slide-to="4"></button>
      <button type="button" data-bs-target="#ungeCarousel" data-bs-slide-to="5"></button>
      <button type="button" data-bs-target="#ungeCarousel" data-bs-slide-to="6"></button>
    </div>

    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="image/img-01unge.jpg" alt="Foto UNGE 1">
      </div>
      <div class="carousel-item">
        <img src="image/img-02unge.jpg" alt="Foto UNGE 2">
      </div>
      <div class="carousel-item">
        <img src="image/IMGE-UNGE2.jpg" alt="Foto UNGE 3">
      </div>
      <div class="carousel-item">
        <img src="image/imge-unge5.jpg" alt="Foto UNGE 4">
      </div>
      <div class="carousel-item">
        <img src="image/img-06unge.jpg" alt="Foto UNGE 5">
      </div>
      <div class="carousel-item">
        <img src="image/img-07unge.jpg" alt="Foto UNGE 6">
      </div>
      <div class="carousel-item">
        <img src="image/rectorIMG-20190720-WA0005-750x375.jpg" alt="Foto UNGE 7">
      </div>
    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#ungeCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#ungeCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <!-- Pie de página con redes sociales -->
  <footer>
    <p>TODOS LOS DERECHOS RESERVADOS © IoT A NUESTRO ALCANCE - UNGE 2026</p>
    <div class="social-buttons">
      <a href="#" class="btn btn-outline-light"><i class="bi bi-twitter"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-facebook"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-instagram"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-youtube"></i></a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
