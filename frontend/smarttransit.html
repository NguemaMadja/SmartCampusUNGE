<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SmartTransit UNGE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap y Leaflet -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">SmartTransit UNGE</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
  </nav>
  <main class="container-fluid mt-3">
    <div class="row">
      <div class="col-md-8">
        <div id="map" style="height:500px;"></div>
      </div>
      <div class="col-md-4">
        <h4>Gestión de Paradas</h4>
        <button class="btn btn-success mb-2" data-bs-toggle="modal" data-bs-target="#modalParada">
          <i class="bi bi-plus-circle"></i> Nueva Parada
        </button>
        <table class="table table-striped">
          <thead>
            <tr>
              <th>ID</th>
              <th>Vehículo</th>
              <th>Nombre Parada</th>
              <th>Latitud</th>
              <th>Longitud</th>
              <th>Orden</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaParadas"></tbody>
        </table>
      </div>
    </div>
    <div class="row mt-4">
      <div class="col-12">
        <h4>Posiciones en Tiempo Real</h4>
        <table class="table table-bordered">
          <thead>
            <tr>
              <th>ID</th>
              <th>Vehículo</th>
              <th>Ruta</th>
              <th>Latitud</th>
              <th>Longitud</th>
              <th>Velocidad</th>
              <th>Dirección</th>
              <th>ETA</th>
              <th>Última actualización</th>
            </tr>
          </thead>
          <tbody id="tablaPosiciones"></tbody>
        </table>
      </div>
    </div>
    <!-- Modal Parada -->
    <div class="modal fade" id="modalParada" tabindex="-1">
      <div class="modal-dialog">
        <form id="formParada" class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Nueva Parada</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="idParada">
            <div class="mb-3">
              <label class="form-label">Vehículo</label>
              <select id="idVehiculo" class="form-select"></select>
            </div>
            <div class="mb-3">
              <label class="form-label">Nombre de la Parada</label>
              <input type="text" id="nombreParada" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Latitud</label>
              <input type="text" id="latitudParada" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Longitud</label>
              <input type="text" id="longitudParada" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Orden</label>
              <input type="number" id="ordenParada" class="form-control">
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </main>
  <footer class="text-center py-3 bg-dark text-light">
    <p>© 2026 Universidad Nacional de Guinea Ecuatorial – SmartTransit UNGE</p>
    <div class="social-buttons">
      <a href="#" class="btn btn-outline-light"><i class="bi bi-facebook"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-twitter"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-instagram"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-linkedin"></i></a>
    </div>
  </footer>
  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // Inicializar mapa
    const map = L.map('map').setView([3.7468, 8.7752], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // Cargar vehículos
    async function cargarVehiculos() {
      const res = await fetch("/api/vehiculos");
      const vehiculos = (await res.json()).data;
      const select = document.getElementById("idVehiculo");
      select.innerHTML = "";
      vehiculos.forEach(v => {
        select.innerHTML += `<option value="${v.id_vehiculo}">${v.ruta}</option>`;
      });
    }
    // Cargar paradas
    async function cargarParadas() {
      const res = await fetch("/api/paradas");
      const paradas = (await res.json()).data;
      const tabla = document.getElementById("tablaParadas");
      tabla.innerHTML = "";
      paradas.forEach(p => {
        tabla.innerHTML += `
          <tr>
            <td>${p.id_parada}</td>
            <td>${p.id_vehiculo}</td>
            <td>${p.nombre_parada}</td>
            <td>${p.latitud}</td>
            <td>${p.longitud}</td>
            <td>${p.orden}</td>
            <td>
              <button class="btn btn-sm btn-primary" onclick="editarParada(${p.id_parada})">Editar</button>
              <button class="btn btn-sm btn-danger" onclick="eliminarParada(${p.id_parada})">Eliminar</button>
            </td>
          </tr>`;
      });
    }

    // Guardar nueva parada
    document.getElementById("formParada").addEventListener("submit", async e => {
      e.preventDefault();
      const parada = {
        id_vehiculo: document.getElementById("idVehiculo").value,
        nombre_parada: document.getElementById("nombreParada").value,
        latitud: document.getElementById("latitudParada").value,
        longitud: document.getElementById("longitudParada").value,
        orden: document.getElementById("ordenParada").value
      };
      await fetch("/api/paradas", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(parada)
      });
      cargarParadas();
      bootstrap.Modal.getInstance(document.getElementById("modalParada")).hide();
    });

    // Editar parada
    async function editarParada(id) {
      const res = await fetch(`/api/paradas/${id}`);
      const parada = (await res.json()).data;
      document.getElementById("idParada").value = parada.id_parada;
      document.getElementById("idVehiculo").value = parada.id_vehiculo;
      document.getElementById("nombreParada").value = parada.nombre_parada;
      document.getElementById("latitudParada").value = parada.latitud;
      document.getElementById("longitudParada").value = parada.longitud;
      document.getElementById("ordenParada").value = parada.orden;
      new bootstrap.Modal(document.getElementById("modalParada")).show();
    }

    // Eliminar parada
    async function eliminarParada(id) {
      await fetch(`/api/paradas/${id}`, { method: "DELETE" });
      cargarParadas();
    }

    // Cargar posiciones dinámicas
    async function cargarPosiciones() {
      const res = await fetch("/api/posiciones");
      const posiciones = (await res.json()).data;
      const tabla = document.getElementById("tablaPosiciones");
      tabla.innerHTML = "";
      posiciones.forEach(pos => {
        tabla.innerHTML += `
          <tr>
            <td>${pos.id_posicion}</td>
            <td>${pos.id_vehiculo}</td>
            <td>${pos.ruta}</td>
            <td>${pos.latitud}</td>
            <td>${pos.longitud}</td>
            <td>${pos.velocidad} km/h</td>
            <td>${pos.direccion}</td>
            <td>${pos.eta_minutos} min</td>
            <td>${pos.timestamp}</td>
          </tr>`;
        // Añadir marcador al mapa
        L.marker([pos.latitud, pos.longitud]).addTo(map)
          .bindPopup(`Bus ${pos.id_vehiculo} – Ruta ${pos.ruta}<br>${pos.direccion}<br>ETA: ${pos.eta_minutos} min`);
      });
    }

    // Inicialización
    cargarVehiculos();
    cargarParadas();
    cargarPosiciones();
    setInterval(cargarPosiciones, 60000); // refrescar cada 60s
  </script>
</body>
</html>
