<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sensores de Medición - SmartCampusUNGE</title>
  <link href="https://jsdelivr.net" rel="stylesheet">
  <link href="https://jsdelivr.net" rel="stylesheet">
  <link href="https://datatables.net" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #003366, #004080); color: white; min-height: 100vh; display: flex; flex-direction: column; }
    .navbar { background-color: #004080; height: 60px; display: flex; align-items: center; }
    .scroll-msg { background-color: #008000; color: #fff; font-weight: bold; padding: 5px; flex: 1; margin: 0 60px; }
    .scroll-msg marquee { font-size: 1.1em; }
    .container-main { flex: 1; padding: 20px; }
    footer { background-color: #004080; color: white; padding: 15px; text-align: center; margin-top: auto; }
    .social-buttons .btn { margin: 5px; border-radius: 50%; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; }
    .btn-nav { background-color: #006400; color: #fff; border-radius: 8px; padding: 8px 20px; margin: 5px; transition: 0.3s; text-decoration: none; display: inline-block; border: none; }
    .btn-nav:hover { background-color: #004d26; color: #fff; transform: scale(1.05); }
  </style>
</head>
<body>
  <!-- Cabecera -->
  <nav class="navbar navbar-dark">
    <a class="navbar-brand d-flex align-items-center ms-3" href="index.html">
      <img src="logo/LOGO-UNGE-1.png" alt="Logo UNGE" class="img-fluid me-2" style="max-height:50px;">
      <span>SmartCampusUNGE</span>
    </a>
    <div class="scroll-msg text-center">
      <marquee behavior="scroll" direction="left" scrollamount="6">
        Gestión de Sensores de Medición: administración y control inteligente
      </marquee>
    </div>
  </nav>

  <!-- Contenido principal -->
  <div class="container-main container">
    <h2 class="text-center text-white mb-4">Sensores de Medición</h2>

    <!-- Botones de navegación -->
    <div class="text-center mb-4">
      <button class="btn-nav" onclick="window.location.href='gestion_energetica.html'">
        <i class="bi bi-arrow-left-circle"></i> Atrás
      </button>
      <button class="btn-nav" onclick="window.location.href='aulas_medicion.html'">
        <i class="bi bi-arrow-right-circle"></i> Ir a Aulas
      </button>
    </div>

    <div class="mb-3 text-end">
      <button class="btn btn-success px-4" onclick="abrirModalCrear()">
        <i class="bi bi-plus-circle"></i> Añadir Sensor
      </button>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-header bg-primary text-white fw-bold">Listado de Sensores</div>
      <div class="card-body">
        <div class="table-responsive w-100">
          <table class="table table-striped table-hover text-dark w-100" id="tablaSensores">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Tipo</th>
                <th>Parámetro</th>
                <th>ID Aula</th>
                <th>Ubicación</th>
                <th style="width: 150px; text-align: center;">Acciones</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Único para Registrar y Editar Sensor -->
  <div class="modal fade" id="modalSensor" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form id="formSensor" class="modal-content text-dark">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="modalTitulo">Registrar Nuevo Sensor</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- Campo oculto para el control de edición -->
          <input type="hidden" id="id_sensor_medicion" name="id_sensor_medicion">
          
          <div class="mb-3">
            <label class="form-label fw-bold">Tipo de Sensor</label>
            <input type="text" class="form-control" id="tipo_sensor" name="tipo_sensor" placeholder="Ej: ESP32" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Parámetro que mide</label>
            <input type="text" class="form-control" id="parametro" name="parametro" placeholder="Ej: Temperatura" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">ID del Aula de Medición</label>
            <input type="number" class="form-control" id="aula_medicion_id" name="aula_medicion_id" placeholder="Ej: 1" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Ubicación física</label>
            <input type="text" class="form-control" id="ubicacion" name="ubicacion" placeholder="Ej: Pared norte">
          </div>
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-success" id="btnGuardar">Guardar</button>
        </div>
      </form>
    </div>
  </div>

   <!-- Footer -->
  <footer>
    <p class="m-0">TODOS LOS DERECHOS RESERVADOS © IoT A NUESTRO ALCANCE - UNGE 2026</p>
    <div class="social-buttons">
      <a href="#" class="btn btn-outline-light"><i class="bi bi-twitter"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-facebook"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-instagram"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-youtube"></i></a>
    </div>
  </footer>

  <!-- Librerías externas -->
  <script src="https://jquery.com"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://datatables.net"></script>
  <script src="https://datatables.net"></script>

  <!-- Script principal -->
  <script>
    const API_BASE = "https://smartcampusunge.onrender.com";

    const tabla = $('#tablaSensores').DataTable({
      language: {
        "processing": "Procesando...",
        "lengthMenu": "Mostrar _MENU_ registros",
        "zeroRecords": "No se encontraron resultados",
        "emptyTable": "Ningún dato disponible en esta tabla",
        "info": "Mostrando _START_ a _END_ de _TOTAL_ registros",
        "infoEmpty": "Mostrando registros del 0 al 0 de un total de 0 registros",
        "infoFiltered": "(filtrado de un total de _MAX_ registros)",
        "search": "Buscar:",
        "loadingRecords": "Cargando...",
        "paginate": {
          "first": "Primero",
          "last": "Último",
          "next": "Siguiente",
          "previous": "Anterior"
        }
      },
      autoWidth: false
    });

    async function cargarSensores() {
      try {
        const res = await fetch(`${API_BASE}/api/sensores_medicion`);
        if (!res.ok) throw new Error(`Error HTTP: ${res.status}`);
        const data = await res.json();

        tabla.clear();
        if (Array.isArray(data.data)) {
          data.data.forEach(s => {
            const tipoEscapado = (s.tipo_sensor || '').replace(/"/g, '&quot;');
            const parametroEscapado = (s.parametro || '').replace(/"/g, '&quot;');
            const ubicacionEscapada = (s.ubicacion || '').replace(/"/g, '&quot;');

            tabla.row.add([
              s.id_sensor,
              s.tipo_sensor,
              s.parametro,
              s.nombre_aula || s.aula_medicion_id,
              s.ubicacion || 'Sin especificar',
              `<div class="text-center d-flex justify-content-center gap-2">
                <button class="btn btn-warning btn-sm shadow-sm" onclick="abrirModalEditar(${s.id_sensor}, '${tipoEscapado}', '${parametroEscapado}', ${s.aula_medicion_id}, '${ubicacionEscapada}')">
                  <i class="bi bi-pencil-square"></i> Editar
                </button>
                <button class="btn btn-danger btn-sm shadow-sm" onclick="eliminarSensor(${s.id_sensor})">
                  <i class="bi bi-trash"></i>
                </button>
              </div>`
            ]);
          });
        }
        tabla.draw();
      } catch (err) {
        console.error("Error cargando sensores:", err);
      }
    }

    function abrirModalCrear() {
      document.getElementById('formSensor').reset();
      document.getElementById('id_sensor_medicion').value = "";
      document.getElementById('modalTitulo').textContent = "Registrar Nuevo Sensor";
      document.getElementById('btnGuardar').textContent = "Guardar";
      document.getElementById('btnGuardar').className = "btn btn-success";
      
      const modalElement = document.getElementById('modalSensor');
      const instance = bootstrap.Modal.getInstance(modalElement) || new bootstrap.Modal(modalElement);
      instance.show();
    }

    function abrirModalEditar(id, tipo, parametro, aulaId, ubicacion) {
      document.getElementById('id_sensor_medicion').value = id;
      document.getElementById('tipo_sensor').value = tipo;
      document.getElementById('parametro').value = parametro;
      document.getElementById('aula_medicion_id').value = aulaId;
      document.getElementById('ubicacion').value = ubicacion === 'Sin especificar' ? '' : ubicacion;
      
      document.getElementById('modalTitulo').textContent = "Modificar Sensor de Medición";
      document.getElementById('btnGuardar').textContent = "Actualizar Cambios";
      document.getElementById('btnGuardar').className = "btn btn-primary";
      
      const modalElement = document.getElementById('modalSensor');
      const instance = bootstrap.Modal.getInstance(modalElement) || new bootstrap.Modal(modalElement);
      instance.show();
    }

    document.getElementById('formSensor').addEventListener('submit', async e => {
      e.preventDefault();
      
      const id = document.getElementById('id_sensor_medicion').value;
      
      // Mapeo directo y seguro de los valores del DOM hacia el formato JSON estricto del Backend
      const body = {
        tipo_sensor: document.getElementById('tipo_sensor').value.trim(),
        parametro: document.getElementById('parametro').value.trim(),
        aula_medicion_id: parseInt(document.getElementById('aula_medicion_id').value, 10),
        ubicacion: document.getElementById('ubicacion').value.trim()
      };

      const url = id ? `${API_BASE}/api/sensores_medicion/${id}` : `${API_BASE}/api/sensores_medicion`;
      const metodo = id ? 'PUT' : 'POST';

      try {
        const res = await fetch(url, {
          method: metodo,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (res.ok) {
          e.target.reset();
          const modalElement = document.getElementById('modalSensor');
          const instance = bootstrap.Modal.getInstance(modalElement);
          if (instance) instance.hide();
          cargarSensores();
        } else {
          console.error("Error al procesar la operación:", res.status);
          alert("Ocurrió un error al guardar los datos en el servidor. Verifica que el ID de Aula exista.");
        }
      } catch (err) {
        console.error("Error en la operación de guardado:", err);
      }
    });

    async function eliminarSensor(id) {
      if (!confirm("¿Está completamente seguro de eliminar este sensor del sistema?")) return;
      try {
        const res = await fetch(`${API_BASE}/api/sensores_medicion/${id}`, { method: 'DELETE' });
        if (res.ok) {
          cargarSensores();
        } else {
          console.error("Error al eliminar sensor:", res.status);
        }
      } catch (err) {
        console.error("Error al eliminar sensor:", err);
      }
    }

    $(document).ready(() => cargarSensores());
  </script>
</body>
</html>
