<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Usuarios - SmartCampusUNGE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #e6f0ff; /* azul elegante */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: #004080;
      color: white;
      padding: 10px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    #sidebar {
      min-height: 100vh;
      background-color: #198754; /* verde elegante */
      color: white;
    }
    #sidebar a {
      color: white;
      text-decoration: none;
    }
    #sidebar.active {
      display: none;
    }
    .content {
      padding: 20px;
      flex-grow: 1;
    }
    footer {
      background-color: #004080;
      color: white;
      padding: 15px;
      text-align: center;
      margin-top: auto;
    }
    .social-buttons .btn {
      margin: 5px;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <!-- Cabecera -->
  <header class="d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center">
      <img src="logo/LOGO-UNGE-1.png" alt="Logo UNGE" style="max-height:60px;" class="me-2">
      <h4>SmartCampusUNGE</h4>
    </div>
    <div>
      <div class="dropdown">
        <button class="btn btn-light dropdown-toggle" type="button" id="superadminMenu" data-bs-toggle="dropdown" aria-expanded="false">
          Superadmin
        </button>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="superadminMenu">
          <li><span class="dropdown-item-text">ID: <span id="userId"></span></span></li>
          <li><span class="dropdown-item-text">Rol: <span id="userRol"></span></span></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item" href="#" onclick="cerrarSesion()">Cerrar sesión</a></li>
        </ul>
      </div>
    </div>
  </header>
  <div class="d-flex">
    <!-- Sidebar -->
    <div id="sidebar" class="p-3">
      <h4>Menú</h4>
      <ul class="nav flex-column">
        <li class="nav-item"><a href="index.html" class="nav-link">Inicio</a></li>
        <li class="nav-item"><a href="usuarios.html" class="nav-link">Usuarios</a></li>
        <li class="nav-item"><a href="profesores.html" class="nav-link">Profesores</a></li>
        <li class="nav-item"><a href="estudiantes.html" class="nav-link">Estudiantes</a></li>
        <li class="nav-item"><a href="radio.html" class="nav-link">Radio</a></li>
      </ul>
    </div>

    <!-- Contenido principal -->
    <div class="content flex-grow-1">
      <button id="menuToggle" class="btn btn-success mb-3">☰ Menú</button>
      <h2>Gestión de Usuarios</h2>
      <!-- Formulario de registro/edición -->
      <form id="formUsuario" class="mb-4">
        <div class="row">
          <div class="col-md-3">
            <input type="text" id="nombre" class="form-control" placeholder="Nombre" required>
          </div>
          <div class="col-md-3">
            <input type="email" id="correo" class="form-control" placeholder="Correo" required>
          </div>
          <div class="col-md-3">
            <input type="password" id="password" class="form-control" placeholder="Contraseña">
          </div>
          <div class="col-md-2">
            <select id="rol" class="form-select" required>
              <option value="superadmin">Superadmin</option>
              <option value="profesor">Profesor</option>
              <option value="estudiante">Estudiante</option>
              <option value="radio">Radio</option>
            </select>
          </div>
          <div class="col-md-1">
            <button type="submit" class="btn btn-primary w-100">Guardar</button>
          </div>
        </div>
      </form>

      <!-- Buscador -->
      <input type="text" id="buscador" class="form-control mb-3" placeholder="Buscar usuario...">
      <!-- Tabla de usuarios -->
      <table id="tablaUsuarios" class="table table-striped">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Rol</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <!-- Botones imprimir y descargar -->
      <button class="btn btn-info mb-2" onclick="imprimirUsuarios()">Imprimir listado</button>
      <button class="btn btn-success mb-2" onclick="descargarUsuarios()">Descargar PDF</button>

      <!-- Gráfica -->
      <canvas id="graficaRoles" width="400" height="200"></canvas>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    document.getElementById("menuToggle").addEventListener("click", () => {
      document.getElementById("sidebar").classList.toggle("active");
    });

    const baseURL = window.location.origin;

    // Cargar usuarios
    async function cargarUsuarios() {
      const token = localStorage.getItem("token");
      const res = await fetch(`${baseURL}/api/usuarios`, {
        headers: { "Authorization": "Bearer " + token }
      });
      const data = await res.json();
      const tbody = document.querySelector("#tablaUsuarios tbody");
      tbody.innerHTML = "";
      let rolesCount = { superadmin:0, profesor:0, estudiante:0, radio:0 };

      data.data.forEach(u => {
        rolesCount[u.rol]++;
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${u.id_usuario}</td>
          <td>${u.nombre}</td>
          <td>${u.correo}</td>
          <td>${u.rol}</td>
          <td>
            <button class="btn btn-warning btn-sm" onclick="editarUsuario(${u.id_usuario}, '${u.nombre}', '${u.correo}', '${u.rol}')">Editar</button>
            <button class="btn btn-danger btn-sm" onclick="eliminarUsuario(${u.id_usuario})">Eliminar</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // Actualizar gráfica
      const ctx = document.getElementById("graficaRoles").getContext("2d");
      new Chart(ctx, {
        type: 'pie',
        data: {
          labels: ['Superadmin', 'Profesor', 'Estudiante', 'Radio'],
          datasets: [{
            data: [rolesCount.superadmin, rolesCount.profesor, rolesCount.estudiante, rolesCount.radio],
            backgroundColor: ['#dc3545','#007bff','#28a745','#ffc107']
          }]
        }
      });
    }

    // Registrar usuario
    async function registrarUsuario(e) {
      e.preventDefault();
      const nombre = document.getElementById("nombre").value;
      const correo = document.getElementById("correo").value;
      const password = document.getElementById("password").value;
      const rol = document.getElementById("rol").value;

      const token = localStorage.getItem("token");
      const res = await fetch(`${baseURL}/api/usuarios/register`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ nombre, correo, password, rol })
      });
      const data = await res.json();
      alert(data.message);

      document.getElementById("formUsuario").reset();
      cargarUsuarios();
    }
    document.getElementById("formUsuario").onsubmit = registrarUsuario;

    // Editar usuario
    async function editarUsuario(id, nombre, correo, rol) {
      document.getElementById("nombre").value = nombre;
      document.getElementById("correo").value = correo;
      document.getElementById("rol").value = rol;

      const form = document.getElementById("formUsuario");
      form.onsubmit = async e => {
        e.preventDefault();
        const nuevoNombre = document.getElementById("nombre").value;
        const nuevoCorreo = document.getElementById("correo").value;
        const nuevoPassword = document.getElementById("password").value;
        const nuevoRol = document.getElementById("rol").value;

        const token = localStorage.getItem("token");
        const res = await fetch(`${baseURL}/api/usuarios/${id}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({ nombre: nuevoNombre, correo: nuevoCorreo, password: nuevoPassword, rol: nuevoRol })
        });
        const data = await res.json();
        alert(data.message);

        form.reset();
        cargarUsuarios();
        form.onsubmit = registrarUsuario; // restaurar acción original
      };
    }

    // Eliminar usuario
    async function eliminarUsuario(id) {
      if (!confirm("¿Seguro que deseas eliminar este usuario?")) return;
      const token = localStorage.getItem("token");
      const res = await fetch(`${baseURL}/api/usuarios/${id}`, {
        method: "DELETE",
        headers: { "Authorization": "Bearer " + token }
      });
      const data = await res.json();
      alert(data.message);
      cargarUsuarios();
    }

    // Buscador
    document.getElementById("buscador").addEventListener("keyup", () => {
      const filtro = document.getElementById("buscador").value.toLowerCase();
      document.querySelectorAll("#tablaUsuarios tbody tr").forEach(tr => {
        tr.style.display = tr.innerText.toLowerCase().includes(filtro) ? "" : "none";
      });
    });
    // Imprimir listado con logo
    function imprimirUsuarios() {
      const contenido = document.getElementById("tablaUsuarios").outerHTML;
      const ventana = window.open("", "", "width=800,height=600");
      ventana.document.write(`
        <html>
          <head><title>Listado de Usuarios</title></head>
          <body>
            <img src="logo/LOGO-UNGE-1.png" style="max-height:80px;"><br>
            ${contenido}
          </body>
        </html>
      `);
      ventana.document.close();
      ventana.print();
    }

    // Descargar PDF con logo
    async function descargarUsuarios() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.addImage("logo/LOGO-UNGE-1.png", "PNG", 10, 10, 30, 30);
      doc.setFontSize(14);
      doc.text("Listado de Usuarios - SmartCampusUNGE", 50, 20);

      let y = 50;
      const filas = document.querySelectorAll("#tablaUsuarios tbody tr");
      filas.forEach(fila => {
        doc.text(fila.innerText, 10, y);
        y += 10;
      });

      doc.save("usuarios_UNGE.pdf");
    }
    // Cerrar sesión
    function cerrarSesion() {
      if (confirm("¿Seguro que deseas cerrar sesión?")) {
        localStorage.clear();
        window.location.href = "login.html";
      }
    }

    // Inicializar
    cargarUsuarios();
    document.getElementById("userId").innerText = localStorage.getItem("userId") || "";
    document.getElementById("userRol").innerText = localStorage.getItem("rol") || "";
  </script>

  <!-- Pie de página -->
  <footer>
    <p>TODOS LOS DERECHOS RESERVADOS © IoT A NUESTRO ALCANCE - UNGE 2026</p>
    <div class="social-buttons">
      <a href="#" class="btn btn-outline-light"><i class="bi bi-twitter"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-facebook"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-instagram"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-youtube"></i></a>
    </div>
  </footer>
</body>
</html>
