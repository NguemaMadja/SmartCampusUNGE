  <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Control - SmartCampusUNGE</title>
  <!-- Bootstrap 5 CSS y Bootstrap Icons cargados de forma eficiente desde CDN -->
  <link href="https://jsdelivr.net" rel="stylesheet">
  <link href="https://jsdelivr.net" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #003366, #004080);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
    }
    /* Menú lateral (Sidebar) */
    #sidebar {
      width: 250px;
      background-color: #004d26;
      color: white;

      top: 0;
      left: -250px;
      height: 100%;
      transition: left 0.3s;
      padding-top: 60px;
      z-index: 1040;
    }
    #sidebar.active { left: 0; }
    #sidebar a {
      display: block;
      padding: 12px 20px;
      color: white;
      text-decoration: none;
      background-color: #008000;
      margin: 5px;
      border-radius: 6px;
    }
    #sidebar a:hover { background-color: #006400; }
    /* Contenedor de contenido */
    #content {
      flex: 1;
      margin-left: 0;
      transition: margin-left 0.3s;
      padding: 20px;
      color: white;
    }
    #sidebar.active ~ #content { margin-left: 250px; }
    /* Barra de navegación (Navbar) */
    .navbar { background-color: #004080; position: relative; height: 60px; display: flex; align-items: center; }
    .dropdown-menu { min-width: 200px; }
    footer { background-color: #004080; color: white; padding: 15px; text-align: center; margin-top: auto; }
    .carousel-item img { width: 100%; height: auto; object-fit: cover; max-height: 450px; }
    .scroll-msg { background-color: #008000; color: #fff; font-weight: bold; padding: 5px; flex: 1; margin: 0 60px; }
    .scroll-msg marquee { font-size: 1.1em; }
    #menuToggle { font-size: 24px; color: white; cursor: pointer; margin-left: 10px; }
    .user-container { margin-right: 10px; }
    .social-buttons .btn {
      margin: 5px; border-radius: 50%; width: 40px; height: 40px;
      display: inline-flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>

  <!-- Content Area -->
  <div id="content">
    <!-- Navbar principal -->
    <nav class="navbar navbar-dark">
      <span id="menuToggle">☰</span>
      <a class="navbar-brand d-flex align-items-center ms-3" href="index.html">
        <img src="logo/LOGO-UNGE-1.png" alt="Logo UNGE" class="img-fluid me-2" style="max-height:50px;">
        <span>SmartCampusUNGE</span>
      </a>
      <div class="scroll-msg text-center">
        <marquee behavior="scroll" direction="left" scrollamount="6" id="marqueeText">
          Verificando credenciales de acceso...
        </marquee>
      </div>
      <div class="dropdown user-container">
        <button class="btn dropdown-toggle text-white fw-bold" type="button" id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-person-circle"></i> <span id="navRoleBtn">Cargando...</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
          <li><span class="dropdown-item-text fw-bold text-secondary" id="userId">ID: --</span></li>
          <li><span class="dropdown-item-text fw-bold text-secondary" id="userRole">Rol: --</span></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</a></li>
        </ul>
      </div>
    </nav>

    <!-- Títulos del Panel Central -->
    <header class="text-center mt-4">
      <h2 id="panelTitle" class="fw-bold">UNGE - Panel de Control</h2>
      <p id="panelSubtitle" class="text-white-50">Acceso optimizado a servicios del campus universitario</p>
    </header>

    <!-- Carrusel Informativo Campus -->
    <div id="carouselFotos" class="carousel slide mt-4 shadow-lg rounded" data-bs-ride="carousel">
      <div class="carousel-inner rounded">
        <div class="carousel-item active">
          <img src="image/IMGE-UNGE2.jpg" class="d-block w-100" alt="Campus UNGE 1">
        </div>
        <div class="carousel-item">
          <img src="image/imge-unge5.jpg" class="d-block w-100" alt="Campus UNGE 2">
        </div>
        <div class="carousel-item">
          <img src="image/rectorIMG-20190720-WA0005-750x375.jpg" class="d-block w-100" alt="Campus UNGE 3">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselFotos" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselFotos" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </div>

  <!-- Footer Institucional -->
  <footer>
    <p class="mb-0">TODOS LOS DERECHOS RESERVADOS © IoT A NUESTRO ALCANCE - UNGE 2026</p>
    <div class="social-buttons mt-2">
      <a href="#" class="btn btn-outline-light"><i class="bi bi-twitter"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-facebook"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-instagram"></i></a>
      <a href="#" class="btn btn-outline-light"><i class="bi bi-youtube"></i></a>
    </div>
  </footer>

  <!-- Bootstrap Bundle JS -->
  <script src="https://jsdelivr.net"></script>
  
  <script>
    // Configuración: Tiempo máximo de inactividad permitido (30 minutos)
    const TIEMPO_MAXIMO_INACTIVIDAD = 30 * 60 * 1000; 

    // 1. BLINDAJE MULTI-ROL INTELIGENTE Y CONTROL DE FLECHAS
    (function () {
      window.history.pushState(null, null, window.location.href);

      const token = localStorage.getItem("token");
      const rol = localStorage.getItem("rol");
      const ultimaActividad = localStorage.getItem("ultimaActividad");
      const horaActual = new Date().getTime();
      const rolesValidos = ["superadmin", "profesor", "estudiante", "radio"];

      // Validar si el usuario está logueado con un rol del sistema
      if (!token || !rolesValidos.includes(rol)) {
        cerrarSesionLimpio();
        window.location.href = "login.html";
        return;
      }

      // Validar caducidad por inactividad prolongada
      if (ultimaActividad && (horaActual - parseInt(ultimaActividad) > TIEMPO_MAXIMO_INACTIVIDAD)) {
        alert("Tu sesión ha caducado por inactividad. Por seguridad, inicia sesión de nuevo.");
        cerrarSesionLimpio();
        window.location.href = "login.html";
        return;
      }

      localStorage.setItem("ultimaActividad", horaActual);
    })();

    // Evitar navegación errónea con flechas del navegador
    window.addEventListener("popstate", function () {
      window.history.pushState(null, null, window.location.href);
    });

    // 2. DETECTOR DINÁMICO DE ACTIVIDAD
    const eventosActividad = ['mousedown', 'mousemove', 'keydown', 'scroll', 'touchstart'];
    eventosActividad.forEach(evento => {
      document.addEventListener(evento, () => {
        const token = localStorage.getItem("token");
        const rol = localStorage.getItem("rol");
        if (token && ["superadmin", "profesor", "estudiante", "radio"].includes(rol)) {
          localStorage.setItem("ultimaActividad", new Date().getTime());
        }
      });
    });

    // Toggle sidebar
    document.getElementById("menuToggle").addEventListener("click", () => {
      document.getElementById("sidebar").classList.toggle("active");
    });

    // 3. CARGAR PERFIL Y APLICAR FILTROS DE LA MATRIZ
    async function cargarPerfil() {
      const token = localStorage.getItem("token");
      const rolLocal = localStorage.getItem("rol");

      try {
        const res = await fetch("http://10.70.200", {
          method: "GET",
          headers: { "Authorization": "Bearer " + token }
        });
        const data = await res.json();
        
        if (data.usuario) {
          if (data.usuario.rol !== rolLocal) {
            cerrarSesionLimpio();
            window.location.href = "login.html";
            return;
          }
          
          document.getElementById("userId").textContent = "ID: " + data.usuario.id;
          document.getElementById("userRole").textContent = "Rol: " + data.usuario.rol.toUpperCase();
          
          const navBtn = document.getElementById("userMenu");
          navBtn.textContent = data.usuario.rol.toUpperCase();

          const rol = data.usuario.rol;

          // RENDERIZADO EXCLUSIVO SEGÚN EL ROL (OCULTAR ELEMENTOS PRIVADOS)
          if (rol === "profesor" || rol === "estudiante") {
            document.getElementById("link-usuarios")?.remove();
            document.getElementById("link-profesores")?.remove();
            document.getElementById("link-estudiantes")?.remove();
            document.getElementById("link-radio-crud")?.remove();
            document.getElementById("link-energia")?.remove();
            document.getElementById("link-academia")?.remove();
            document.getElementById("link-config")?.remove();
            
            navBtn.className = "btn btn-primary dropdown-toggle fw-bold";
          } 
          else if (rol === "radio") {
            document.getElementById("link-usuarios")?.remove();
            document.getElementById("link-profesores")?.remove();
            document.getElementById("link-estudiantes")?.remove();
            document.getElementById("link-energia")?.remove();
            document.getElementById("link-academia")?.remove();
            document.getElementById("link-config")?.remove();
            
            navBtn.className = "btn btn-success dropdown-toggle fw-bold";
          } 
          else if (rol === "superadmin") {
            navBtn.className = "btn btn-danger dropdown-toggle fw-bold";
          }
        }
      } catch (err) {
        console.error("Error en perfil:", err);
      }
    }

    function cerrarSesionLimpio() {
      localStorage.removeItem("token");
      localStorage.removeItem("rol");
      localStorage.removeItem("ultimaActividad");
    }

    // Botón manual de Logout
    document.getElementById("logoutBtn").addEventListener("click", (e) => {
      e.preventDefault();
      cerrarSesionLimpio();
      window.location.href = "login.html";
    });

    // Ejecutar validaciones al cargar
    cargarPerfil();
  </script>
  
</body>
</html>
